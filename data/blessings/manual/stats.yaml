# Which Stat Details stat each blessing raises (SPEC §4.3, §4.6). My mapping — unverified.
# Blessings with a `stat` are already counted in Stat Details, so the simulator never adds them.
# Tag blessings ([Sword] Weapon DMG, …) map to a tag stat ([Sword] DMG Increase) that adds to items with that tag,
# like [Creature] DMG Increase. Skill buffs are [later]; conditional bonuses use combat_bonus.

- { id: all_dmg, stat: all_dmg_increase, source: manual, verified: false }
- { id: hp, stat: hp, source: manual, verified: false }
- { id: item_haste, stat: item_haste, source: manual, verified: false }
- { id: healing_power_enhance, stat: healing_power_enhance, source: manual, verified: false }
- { id: block_gain, stat: block_gain, source: manual, verified: false }
- { id: attack_dmg, stat: attack_dmg_increase, source: manual, verified: false }
- { id: crit_dmg, stat: crit_dmg, source: manual, verified: false }
- { id: vamp_recovery_amount, stat: vamp_recovery_amount, source: manual, verified: false }
- { id: dmg_against_stunned_enemies, stat: dmg_vs_stunned, source: manual, verified: false }
- { id: poison_dmg, stat: poison_dmg_increase, source: manual, verified: false }
- { id: burn_dmg, stat: burn_dmg_increase, source: manual, verified: false }
- { id: spike_dmg, stat: spike_dmg_increase, source: manual, verified: false }
- { id: creature_weapon_dmg, stat: creature_dmg_increase, source: manual, verified: false, notes: 'Stat Details has "[Creature] DMG Increase", so this one is a stat.' }

