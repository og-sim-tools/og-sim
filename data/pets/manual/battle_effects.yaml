# Pet skills in battle, structured from the in-game text in observed_batch_{1,2,3}.yaml (2026-10-16).
# One effect per star tier: min_stars / max_stars pick the version that applies at the pet's stars.
# Star lines always add to the skill's value (user rule). Pets ignore Haste / Freeze (timers are fixed).
# Readings of texts that need one are listed in docs/item-readings.md (confirmed by the user's in-game data, 2026-10-17).
# Red Dragon's effects are in observed_batch_1.yaml.

- id: seiren
  effects:
    - { text: "Start of Battle: gain Waterdrop Cushion equal to 100% of max HP.", trigger: battle_start, target: player, action: apply_status, status: waterdrop_cushion, stacks: 100, max_stars: 0 }
    - { text: "Start of Battle: Waterdrop Cushion 200% of max HP. (1★)", trigger: battle_start, target: player, action: apply_status, status: waterdrop_cushion, stacks: 200, min_stars: 1, max_stars: 4 }
    - { text: "Start of Battle: Waterdrop Cushion 300% of max HP. (5★)", trigger: battle_start, target: player, action: apply_status, status: waterdrop_cushion, stacks: 300, min_stars: 5 }
    - { text: "On Excess Heal: Waterdrop Cushion equal to 20% of the healed amount. (2★)", trigger: on_heal, watch: any, min_event_amount: 0, target: player, action: apply_status, status: waterdrop_cushion, value_as_hp_pct: true, event_pct: 20, min_stars: 2, max_stars: 3 }
    - { text: "On Excess Heal: 40% of the healed amount. (4★)", trigger: on_heal, watch: any, min_event_amount: 0, target: player, action: apply_status, status: waterdrop_cushion, value_as_hp_pct: true, event_pct: 40, min_stars: 4, max_stars: 5 }
    - { text: "On Excess Heal: 60% of the healed amount. (6★)", trigger: on_heal, watch: any, min_event_amount: 0, target: player, action: apply_status, status: waterdrop_cushion, value_as_hp_pct: true, event_pct: 60, min_stars: 6 }
    - { text: "When entering Berserk: Waterdrop Cushion equal to 200% of max HP. (3★)", trigger: on_berserk, target: player, action: apply_status, status: waterdrop_cushion, stacks: 200, min_stars: 3, max_stars: 4 }
    - { text: "When entering Berserk: 300% of max HP. (5★)", trigger: on_berserk, target: player, action: apply_status, status: waterdrop_cushion, stacks: 300, min_stars: 5 }

- id: white_wolf_captain
  effects:
    - { text: "Start of Battle: for 10s, all weapons gain 30% Haste.", trigger: battle_start, target: all_items, filter: { tags_any: [weapon] }, action: add_stat_pct, stat: haste_pct, amount: 30, duration_s: 10, max_stars: 1 }
    - { text: "… 45% Haste. (2★)", trigger: battle_start, target: all_items, filter: { tags_any: [weapon] }, action: add_stat_pct, stat: haste_pct, amount: 45, duration_s: 10, min_stars: 2, max_stars: 3 }
    - { text: "… 60% Haste. (4★)", trigger: battle_start, target: all_items, filter: { tags_any: [weapon] }, action: add_stat_pct, stat: haste_pct, amount: 60, duration_s: 10, min_stars: 4, max_stars: 4 }
    - { text: "… 60% Haste for 15s. (5★)", trigger: battle_start, target: all_items, filter: { tags_any: [weapon] }, action: add_stat_pct, stat: haste_pct, amount: 60, duration_s: 15, min_stars: 5 }
    - { text: "The Wolf Captain deals 0.5x ATK DMG 3 times every 3s.", trigger: timer, interval_s: 3, target: enemy, action: deal_damage, damage_type: weapon, can_crit: true, hits: 3, value: { ratio: 0.5, scales_with: atk } }

- id: hunting_hawk
  effects:
    - { text: "Every 4s: Remove 10 buffs from whichever of the enemy's Focus or Dodge has more.", trigger: timer, interval_s: 4, target: enemy, action: remove_status, pick_from: [focus, dodge], count: 10, count_unit: stacks, max_stars: 3 }
    - { text: "… Remove 15. (4★)", trigger: timer, interval_s: 4, target: enemy, action: remove_status, pick_from: [focus, dodge], count: 15, count_unit: stacks, min_stars: 4 }
    - { text: "… 50% chance to steal 5 more. (5★)", trigger: timer, interval_s: 4, chance_pct: 50, target: enemy, action: steal_status, pick_from: [focus, dodge], count: 5, count_unit: stacks, min_stars: 5 }
    - { text: "Weapons Haste +60% while the enemy has 30+ Focus and Dodge in total.", trigger: passive, target: all_items, filter: { tags_any: [weapon] }, action: add_stat_pct, stat: haste_pct, amount: 60, condition: { who: enemy, statuses_total: { statuses: [focus, dodge], min: 30 } }, max_stars: 1 }
    - { text: "… +120%. (2★)", trigger: passive, target: all_items, filter: { tags_any: [weapon] }, action: add_stat_pct, stat: haste_pct, amount: 120, condition: { who: enemy, statuses_total: { statuses: [focus, dodge], min: 30 } }, min_stars: 2 }

