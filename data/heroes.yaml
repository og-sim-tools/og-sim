# In-game values beat the wiki. Where an entry differs from the wiki, `corrections` keeps the wiki value
# (field, wiki, source, verified). Provenance per entry: source (wiki / observed / manual), url, verified, notes.
# Edit here directly, or with the item editor (it writes here too).

- id: erwen
  name: Erwen
  class: ranger
  rarity: legendary
  base_supply_ability: 10
  skills:
    - id: spirit_affinity
      name: Spirit Affinity
      text: "Start of Game: Enhance fixed 2 slots in the backpack with Fire and Wind elements respectively. When entering Shop: Consume a Spirit Stone on an enhanced slot to summon Fire Spirit or Wind Spirit. Upon entering round 1/5/9: Create 1 Spirit Stone."
    - {id: chasing_arrow, name: Chasing Arrow, text: "Upon gaining 10 Swift: Gain 3 Focus."}
  skill_links:
    - {stars: 4, skill: chasing_arrow}
    - {stars: 8, skill: spirit_affinity}
  exclusive_items:
    - {item: spirit_stone, note: You can buy the Spirit Stone item in the Shop.}
    - {item: erwens_bow, note: You are able to merge Erwen's Bow.}
  supplies:
    - {stars: 0, item: poison_bow}
    - {stars: 0, item: fire_spirit}
    - {stars: 1, item: spirit_stone}
    - {stars: 3, item: wind_spirit}
    - {stars: 5, item: air_walker}
    - {stars: 7, item: erwens_bow}
  skill_effects:
    spirit_affinity: {status: shop, effects: [], notes: "Enhanced Fire / Wind slots, Spirit Stones and summoning all happen in the shop."}
    chasing_arrow:
      status: complete
      effects:
        - text: "Upon gaining 10 Swift: Gain 3 Focus."
          trigger: on_status_applied
          watch: any
          params: {status: swift}
          every: 10
          target: player
          action: apply_status
          status: focus
          stacks: 3
      notes: Counts Swift my items give me (10 gained in total → 3 Focus, then the next 10 …).
  source: wiki
  url: https://overgearedhero.fandom.com/wiki/Erwen
  verified: false

