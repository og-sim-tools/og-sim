# Skins: the simulator's database, one complete entry each (like a wiki page).
# In-game values beat the wiki. Where an entry differs from the wiki, `corrections` keeps the wiki value
# (field, wiki, source, verified). Provenance per entry: source (wiki / observed / manual), url, verified, notes.
# Edit here directly, or with the item editor (it writes here too).

- id: raven_apostle_of_death
  name: Raven, Apostle of Death
  hero: raven
  rarity: legendary
  skill:
    name: Raven Storm
    quest: Must consume a total of 300 Focus.
    reward: When gaining Dodge, gain the same amount of Focus, and Attack DMG increases by 1% per Dodge stack.
    by_grade: For each stack of Dodge, Attack DMG increases by an additional 0.5%/0.5%/0.5%/1%/1.5%.
  quest_check: {type: run, note: consume 300 Focus in total over the run}
  available: {classes: [ranger]}
  status: complete
  effects:
    - text: When gaining Dodge, gain the same amount of Focus.
      trigger: on_status_applied
      watch: any
      params: {status: dodge}
      target: player
      action: apply_status
      status: focus
      event_pct: 100
    - text: Attack DMG increases by 1% per Dodge stack.
      trigger: passive
      target: player
      action: add_player_stat
      player_stat: attack_dmg_increase
      amount_from: {status: dodge, status_on: self, factor: 1}
      max_stars: 0
    - text: … 1.5% per Dodge stack (1★).
      trigger: passive
      target: player
      action: add_player_stat
      player_stat: attack_dmg_increase
      amount_from: {status: dodge, status_on: self, factor: 1.5}
      min_stars: 1
      max_stars: 1
    - text: … 2% per Dodge stack (2★).
      trigger: passive
      target: player
      action: add_player_stat
      player_stat: attack_dmg_increase
      amount_from: {status: dodge, status_on: self, factor: 2}
      min_stars: 2
      max_stars: 2
    - text: … 2.5% per Dodge stack (3★).
      trigger: passive
      target: player
      action: add_player_stat
      player_stat: attack_dmg_increase
      amount_from: {status: dodge, status_on: self, factor: 2.5}
      min_stars: 3
      max_stars: 3
    - text: … 3.5% per Dodge stack (4★).
      trigger: passive
      target: player
      action: add_player_stat
      player_stat: attack_dmg_increase
      amount_from: {status: dodge, status_on: self, factor: 3.5}
      min_stars: 4
      max_stars: 4
    - text: … 5% per Dodge stack (5★).
      trigger: passive
      target: player
      action: add_player_stat
      player_stat: attack_dmg_increase
      amount_from: {status: dodge, status_on: self, factor: 5}
      min_stars: 5
  ownership_text: "[All] Increase Total HP by 5%"
  source: observed
  verified: true
  notes: Dodge I steal from the enemy doesn't count as gaining it here (only Dodge my side applies).

