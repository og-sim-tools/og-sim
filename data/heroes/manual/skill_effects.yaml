# ---------------------------------------------------------------- Wizard
- id: trixie
  skill_effects:
    ill_be_having_that:
      status: complete
      effects:
        - { text: "When removing an enemy buff: 30% chance to steal that buff instead.", trigger: passive, target: player, action: add_player_stat, player_stat: steal_on_remove_pct, amount: 30 }
      notes: One roll per removal effect; on success I gain everything it removed.
    consider_this_yours:
      status: complete
      effects:
        - { text: "Reflects 20% of received debuffs.", trigger: passive, target: player, action: add_player_stat, player_stat: debuff_reflect_pct, amount: 20 }
      notes: I still get the full debuff; 20% of the stacks (fractions alternate) also go onto the enemy.
  source: manual
  verified: false

- id: cecilia
  skill_effects:
    instant_casting:
      status: complete
      effects:
        - { text: "Every 4s: Activate spells in enhanced slots.", trigger: timer, interval_s: 4, target: all_items, filter: { tags_any: [spell], enhanced: true }, action: activate_item }
      notes: The enhanced slot is random each run, so mark it on the layout (Enhanced cells).
      # Green: Cecilia's slot (user, 2026-10-19). From the skill text: "Enhance 1 random slot(s)".
      enhanced_slots: { count: 1, color: "#22c55e", label: "spells here activate every 4s" }
    backmasking:
      status: complete
      effects:
        - { text: "Whenever 20 enemy Burn or Freeze is removed: Randomly activate a Spell in the backpack.", trigger: on_status_removed, params: { statuses: [burn, freeze] }, every: 20, target: all_items, filter: { tags_any: [spell] }, action: activate_item, pick_random: 1 }
      notes: Counts Burn and Freeze taken off the enemy by effects (cleanse, remove, steal), not stacks running out.
  source: manual
  verified: false

- id: spark
  skill_effects:
    electrostatic_force:
      status: complete
