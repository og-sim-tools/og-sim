- id: heal_amount_reduction
  name: Heal Amount Reduction
  polarity: debuff
  description: |-
    Reduces HP Healing from items, Vamp, and Regen by the listed percentage.
    _Increasing healing amount can counter this value._
  behaviour: heal_reduction
  removable: false
  source: wiki
  url: https://overgearedhero.fandom.com/wiki/Stats_and_Effects
  verified: false
  notes: "Behaves like a stat (shows on the buff tab): can't be cleansed or stolen. Healing-increase bonuses counter it additively: heal × (1 + heal_bonus% − reduction%), floor 0."

